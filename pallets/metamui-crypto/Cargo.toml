[package]
name = "pallet-metamui-crypto"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Unlicense"
homepage.workspace = true
repository.workspace = true
description = "Metamui cryptographic implementation with Falcon 512 for Substrate"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

# Substrate
sp-core.workspace = true
sp-std.workspace = true
sp-runtime.workspace = true
sp-application-crypto.workspace = true
log.workspace = true

# Optional for std features
sp-io = { workspace = true, optional = true }

# TODO: Add Falcon 512 implementation crate
# falcon-rust = { version = "0.1.0", optional = true }

[dev-dependencies]
sp-io.workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-std/std",
    "sp-runtime/std",
    "sp-application-crypto/std",
    "sp-io?/std",
    "log/std",
    # TODO: Enable falcon-rust std feature when added
    # "falcon-rust?/std",
]