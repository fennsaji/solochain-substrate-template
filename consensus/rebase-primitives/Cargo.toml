[package]
name = "sp-rebase-api"
version = "0.1.0"
edition = "2021"
description = "Rebase API primitives for Genesis Block Rebasing"
license = "Unlicense"

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["derive"], workspace = true }
sp-api = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "serde/std",
    "sp-api/std",
    "sp-runtime/std",
    "sp-std/std",
]